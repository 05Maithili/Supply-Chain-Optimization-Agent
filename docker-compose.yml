version: '3.9'

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplychain-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/supplychain.db
      - backend-uploads:/app/uploads
      - backend-rag:/app/rag/vector_store
      - backend-models:/app/ml_models
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=sqlite+aiosqlite:///./supplychain.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:5173
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - supplychain-network

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplychain-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - supplychain-network

  # ── Ollama LLM ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: supplychain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - supplychain-network

volumes:
  backend-data:
  backend-uploads:
  backend-rag:
  backend-models:
  ollama-data:

networks:
  supplychain-network:
    driver: bridge
